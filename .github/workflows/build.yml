name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          unzip -o ParanornAPP-Android.zip -d projeto

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        working-directory: projeto
        run: gradle assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ParanornAPP
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
